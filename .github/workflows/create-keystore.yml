name: Create keystore

# Запускается ОДИН раз вручную (Actions -> Create keystore -> Run workflow).
# Создаёт ключ подписи для Google Play и кладёт его в архив (artifact) на 1 день.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate upload keystore
        run: |
          PASS=$(openssl rand -hex 12)
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt \
            -keystore upload.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Circle Racer, O=Circle Racer, C=RU"
          mkdir out
          cp upload.jks out/upload.jks
          base64 -w0 upload.jks > out/KEYSTORE_B64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_ALIAS=upload\nKEY_PASSWORD=%s\n' "$PASS" "$PASS" > out/PASSWORDS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-SECRET
          path: out/*
          retention-days: 1
