name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Install Android SDK parts
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare project (SDL3 + SQLite + game + icon)
        run: |
          set -e
          SDL_VER=3.2.20
          SQLITE_ZIP=sqlite-amalgamation-3460100

          # 1. шаблон Android-проекта и исходники SDL3
          curl -fL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL3-${SDL_VER}.tar.gz"
          mkdir sdl
          tar xzf sdl.tgz -C sdl --strip-components=1
          cp -r sdl/android-project proj
          mkdir -p proj/app/jni/SDL
          cp -r sdl/. proj/app/jni/SDL/
          rm -rf proj/app/jni/SDL/android-project

          # 2. SQLite (amalgamation) — компилируется прямо в приложение
          curl -fL -o sqlite.zip "https://www.sqlite.org/2024/${SQLITE_ZIP}.zip"
          unzip -q sqlite.zip
          mkdir -p proj/app/jni/src/sqlite
          cp "${SQLITE_ZIP}/sqlite3.c" "${SQLITE_ZIP}/sqlite3.h" proj/app/jni/src/sqlite/

          # 3. игра
          cp gonki.cxx proj/app/jni/src/main.cxx
          sed -i 's/YourSourceHere.c/main.cxx/' proj/app/jni/src/CMakeLists.txt
          printf '%s\n' \
            'target_compile_features(main PRIVATE cxx_std_17)' \
            'target_compile_definitions(main PRIVATE USE_LINKED_SQLITE=1)' \
            'add_library(sqlite3_lib STATIC sqlite/sqlite3.c)' \
            'target_compile_definitions(sqlite3_lib PRIVATE SQLITE_THREADSAFE=1 SQLITE_OMIT_LOAD_EXTENSION=1)' \
            'set_target_properties(sqlite3_lib PROPERTIES POSITION_INDEPENDENT_CODE ON)' \
            'target_include_directories(main PRIVATE sqlite)' \
            'target_link_libraries(main PRIVATE sqlite3_lib)' \
            >> proj/app/jni/src/CMakeLists.txt

          # 4. gradle: идентификатор приложения и версия NDK
          sed -i 's/namespace = "org.libsdl.app"/namespace = "org.libsdl.app"\n    ndkVersion "27.0.12077973"/' proj/app/build.gradle
          sed -i 's/versionCode 1/applicationId "com.example.circleracer"\n        versionCode 1/' proj/app/build.gradle

          # 4b. номер версии растёт с каждой сборкой (Google Play не принимает одинаковые)
          sed -i "s/versionCode 1\$/versionCode ${{ github.run_number }}/" proj/app/build.gradle

          # 4c. подпись релизной сборки (ключ берётся из секретов репозитория)
          cat >> proj/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("../upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          # 5. манифест: только портретная ориентация и доступ к сети (игра по Wi-Fi)
          sed -i 's/android:exported="true"/android:exported="true"\n            android:screenOrientation="portrait"/' proj/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application#' proj/app/src/main/AndroidManifest.xml

          # 6. название приложения
          mkdir -p proj/app/src/main/res/values
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Circle Racer</string>' \
            '</resources>' \
            > proj/app/src/main/res/values/strings.xml

          # 7. иконка из icon.png
          which convert > /dev/null || (sudo apt-get update > /dev/null && sudo apt-get install -y imagemagick > /dev/null)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            mkdir -p "proj/app/src/main/res/mipmap-$d"
            convert icon.png -resize "${s}x${s}" "proj/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      # Если в секретах репозитория есть ключ подписи — собирается релиз (AAB для Google Play + подписанный APK).
      # Если ключа нет — как раньше собирается отладочный APK для установки на свой телефон.
      - name: Build
        working-directory: proj
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload.jks
            gradle bundleRelease assembleRelease -PBUILD_WITH_CMAKE --no-daemon --stacktrace
          else
            echo "Ключа подписи нет - собираю отладочный APK (для Google Play он не подходит)"
            gradle assembleDebug -PBUILD_WITH_CMAKE --no-daemon --stacktrace
          fi

      - name: Collect
        run: |
          mkdir -p out
          if [ -f proj/app/build/outputs/bundle/release/app-release.aab ]; then
            cp proj/app/build/outputs/bundle/release/app-release.aab out/CircleRacer.aab
            cp proj/app/build/outputs/apk/release/app-release.apk out/CircleRacer.apk
          else
            cp proj/app/build/outputs/apk/debug/app-debug.apk out/CircleRacer-debug.apk
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: CircleRacer
          path: out/*
